  // curseur du champ : fixe pendant la frappe, clignote sinon (cadence 1 s)
  const m = M[ida] || M.n00, car = $('#caret');
  const typing = t >= .42 && t <= KEYS[KEYS.length - 1] + .45;
  const blinkOn = typing || t >= T_LOOP || ((t < .42 ? t : t - (KEYS[KEYS.length - 1] + .45)) % 1.0) < .55;
  car.style.display = (!COVER && (t < T_BLUR || t >= T_LOOP) && blinkOn) ? 'block' : 'none';
  car.style.left = (m.caret + 1) + 'px';
  car.style.top = (m.input[1] + m.input[3] / 2 - 11 + SB) + 'px';

  // gestes : pastille du doigt, appui puis relâche
  const tap = $('#tap'); tap.style.opacity = 0;
  for (const [tt, sx, sy] of TAPS) {
    if (COVER || t < tt - .16 || t > tt + .5) continue;
    const x = tx + sx * c.k * sc, y = ty + sy * c.k * sc;
    const pin = E.out(seg(t, tt - .16, tt)), pup = E.out(seg(t, tt + .06, tt + .5));
    tap.style.left = x + 'px'; tap.style.top = y + 'px';
    tap.style.opacity = pin * (1 - pup);
    tap.style.transform = `scale(${(1.35 - .35 * pin) * (1 + .5 * pup)})`;
  }

  // liste des communes (menu natif dessiné) : s'ouvre au toucher, Morges surligné, se ferme net
  const sh = $('#sheet');
  const so = E.out(seg(t, T_SEL + .03, T_SEL + .15)), sc2 = seg(t, T_MOR + .03, T_MOR + .09);
  sh.style.display = (!COVER && t >= T_SEL && t < T_MOR + .1) ? 'block' : 'none';
  sh.style.opacity = so * (1 - sc2);
  sh.style.transform = `scale(${.94 + .06 * so})`;
  $('#sheet .m').style.background = `rgba(17,19,24,${(.09 * E.out(seg(t, T_MOR - .1, T_MOR))).toFixed(3)})`;

  // bandeau du haut : bord net (filet 1 px) ; pendant l'intro, il reste au-dessus du téléphone
  for (const [s, a, b] of TTL) title($(s), COVER ? 0 : (t >= T_LOOP ? -.5 : t), a, b);
  if (t >= T_LOOP) $('#t1').style.opacity = loop;
  const bandOut = exit;
  const intro = COVER ? 1 : (t >= T_LOOP ? 0 : E.inOut(seg(t, .45, 1.4)));
  const gl = COVER ? 612 : lerp(526, 568, intro);
  $('#band').style.background = `linear-gradient(#F7F7F4 0,#F7F7F4 ${gl}px,rgba(247,247,244,0) ${gl + 16}px)`;
  $('#bline').style.top = gl + 'px';
  $('#bline').style.opacity = COVER ? 1 : intro * (1 - exit);
  $('#live').style.opacity = t >= T_LOOP ? loop : 1 - bandOut;
  $('#live i').style.opacity = .55 + .45 * Math.cos(t * Math.PI * 1.6) ** 2;
  const dp = COVER ? 1 : (t >= T_LOOP ? 0 : spring(t - .5, 16, .62));
  $('#demo').style.opacity = clamp(dp * 1.4) * (1 - exit);       // même sortie que le téléphone
  $('#demo').style.transform = `scale(${.86 + .14 * dp})`;
  // « Votre salon à Morges. » : cadre bleu qui se pose (ressort sec)
  const h = spring(t - 6.50, 15, .7), hOut = E.inOut(seg(t, 6.98, 7.18));
  $('#hl').style.opacity = COVER ? 0 : clamp(h * 1.6) * (1 - hOut);
  $('#hl').style.transform = `scale(${1.12 - .12 * h})`;

  // écran final (le téléphone est déjà parti quand le logo arrive)
  const eOn = !COVER && t >= T_END - .05;
  $('#end').style.display = eOn ? 'block' : 'none';
  if (eOn) {
    $('#end').style.opacity = 1 - endOut;
    const r = (el, a, dy = 46) => { const q = E.out5(seg(t, a, a + .6)); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * dy}px)`; };
    r($('#eLogo'), T_END, 30); r($('#eKick'), T_END + .1); r($('#eTitle'), T_END + .2, 56); r($('#eHandle'), T_END + .75, 24);
    const w = spring(t - (T_END + .45), 14, .7);
    $('#eWa').style.opacity = clamp(w * 1.5); $('#eWa').style.transform = `translateY(${(1 - w) * 40}px) scale(${.94 + .06 * w})`;
    const tc = t - (T_END + .8);                    // curseur Klein après « offerte. » (raccord avec le champ du début)
    $('#eCur').style.opacity = tc < 0 ? 0 : ((tc % 1.0) < .55 ? 1 : 0);
  }
}
window.render = render;

const q = new URLSearchParams(location.search);
if (q.has('safe')) document.body.classList.add('show-safe');
if (q.has('cover')) document.body.classList.add('cover');   // couverture : état c2, titre à y ≥ 88 dans le recadrage de la grille
Promise.all([document.fonts.load('600 40px IS'), document.fonts.load('500 20px PM'), document.fonts.load('400 40px IS'), document.fonts.load('500 40px IS')])
  .then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))))
  .then(() => { render(q.has('t') ? +q.get('t') : 0); window.READY = true; });
</script>
</body>
</html>
