<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reel OONDE</title>
<link rel="icon" href="data:,">
<style>
/* Kit Reels OONDE : DA v7. Polices et logos servis par render.cjs sous /_kit/ */
@font-face{font-family:IS;src:url(/_kit/fonts/instrument-sans-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:IS;src:url(/_kit/fonts/instrument-sans-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:IS;src:url(/_kit/fonts/instrument-sans-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:PM;src:url(/_kit/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:PM;src:url(/_kit/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:CG;src:url(/_kit/fonts/cormorant-garamond-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:CG;src:url(/_kit/fonts/cormorant-garamond-latin-400-italic.woff2) format('woff2');font-style:italic}
:root{--paper:#F7F7F4;--card:#FFFFFF;--ink:#111318;--soft:#3A3F47;--muted:#6B7078;--line:#DCDED8;--klein:#2038EC;--wa:#14803C}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{color:var(--ink);font-family:IS,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
.mono{font-family:PM,monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.k{color:var(--klein)}
/* zones de sécurité Instagram / TikTok (affichées avec ?safe) : rien d'important hors du cadre vert */
#safe{position:absolute;left:60px;top:250px;width:880px;height:1250px;outline:3px dashed #19b34a;pointer-events:none;display:none;z-index:99}
.show-safe #safe{display:block}
</style>
</head>
<body>
<div id="stage">
  <!-- scènes ici : éléments positionnés en absolu, animés par render(t) -->
  <div id="title" style="position:absolute;left:80px;top:640px;width:880px;font:600 104px/1.02 IS;letter-spacing:-.025em">Votre titre<br>en <span class="k">deux</span> lignes.</div>
  <img id="logo" src="/_kit/brand/logo.svg" alt="" style="position:absolute;left:80px;top:1420px;height:64px">
  <div id="safe"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0 → 1 entre a et b
const E = {                                                // courbes
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// apparition standard : monte de 40 px et s'éclaire entre a et a+d
function rise(el, t, a, d = .45, dy = 40) { const p = E.out(seg(t, a, a + d)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; }
// texte tapé : n premières lettres
function typed(el, text, t, a, cps = 14) { const n = Math.floor(clamp((t - a) * cps, 0, text.length)); el.textContent = text.slice(0, n); return n; }

window.DURATION = 6;
function render(t) {
  rise($('#title'), t, .2);
  rise($('#logo'), t, 1.0);
}
window.render = render;

const q = new URLSearchParams(location.search);
if (q.has('safe')) document.body.classList.add('show-safe');
Promise.all([document.fonts.load('600 40px IS'), document.fonts.load('500 20px PM'), document.fonts.load('400 40px IS')])
  .then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))))
  .then(() => { render(q.has('t') ? +q.get('t') : 0); window.READY = true; });
</script>
</body>
</html>
