  <!-- cou -->
  <rect x="172" y="300" width="56" height="60" rx="20" fill="#e6b294"/>
  <!-- permanente violette (arrière) -->
  <g fill="#8e5cd1">
    <circle cx="110" cy="200" r="48"/><circle cx="290" cy="200" r="48"/>
    <circle cx="105" cy="255" r="40"/><circle cx="295" cy="255" r="40"/>
  </g>
  <!-- visage -->
  <ellipse cx="200" cy="215" rx="98" ry="112" fill="#f2c4a8"/>
  <!-- permanente (dessus) -->
  <g fill="#a374e6">
    <circle cx="125" cy="130" r="44"/><circle cx="170" cy="100" r="46"/><circle cx="225" cy="98" r="46"/>
    <circle cx="275" cy="125" r="44"/><circle cx="300" cy="165" r="34"/><circle cx="100" cy="165" r="34"/>
  </g>
  <!-- joues -->
  <circle cx="140" cy="250" r="20" fill="#ff7aa8" opacity=".55"/><circle cx="260" cy="250" r="20" fill="#ff7aa8" opacity=".55"/>
  <!-- lunettes papillon roses -->
  <g fill="none" stroke="#ff2e88" stroke-width="9" stroke-linejoin="round">
    <path d="M118 200 Q120 178 165 182 Q190 186 186 210 Q180 232 150 232 Q120 230 118 200 Z"/>
    <path d="M282 200 Q280 178 235 182 Q210 186 214 210 Q220 232 250 232 Q280 230 282 200 Z"/>
