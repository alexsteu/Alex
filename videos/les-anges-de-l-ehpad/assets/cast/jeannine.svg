  <path d="M128 168 Q150 150 178 160" stroke="#6b3fa8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M222 160 Q250 150 272 168" stroke="#6b3fa8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- nez -->
  <path d="M200 215 Q192 245 204 250" stroke="#d99a7c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- bouche : rouge à lèvres, moue outrée -->
