    <style>
      :root {
        --bg: #1a0b1e;
        --bg-2: #2b1233;
        --fg: #fff4e8;
        --muted: #e9cfe0;
        --accent: #ff2e88;
        --gold: #ffd23f;
        --ink: #14070f;
        --font-display: "League Gothic", "Bebas Neue", sans-serif;
        --font-body: "Montserrat", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #main {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }
      .scene {
        position: absolute;
        inset: 0;
      }

      /* ---------- Briques partagées par toutes les scènes ---------- */
      .full {
        position: absolute;
        inset: 0;
      }
      .display {
        font-family: var(--font-display);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .mono {
        font-family: var(--font-mono);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 46 136 / 55%) 0%, rgb(255 46 136 / 0%) 68%);
      }
      .ghost {
        position: absolute;
        font-family: var(--font-display);
        text-transform: uppercase;
        color: rgb(255 46 136 / 16%);
        white-space: nowrap;
        line-height: 0.85;
      }
      /* Bandeau nom façon télé-réalité */
      .lt {
        position: absolute;
        left: 64px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .lt-name {
        display: block;
        background: var(--accent);
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 120px;
        line-height: 1;
        padding: 6px 28px 0;
        text-transform: uppercase;
      }
      .lt-role {
        display: block;
        background: var(--fg);
        color: var(--ink);
        font-family: var(--font-body);
        font-weight: 900;
        font-size: 40px;
        padding: 10px 22px;
      }
      /* Citation sous-titrée */
      .quote {
        position: absolute;
        left: 64px;
        right: 64px;
        font-family: var(--font-body);
        font-weight: 900;
        font-size: 66px;
        line-height: 1.12;
        color: var(--fg);
        text-shadow: 0 6px 0 rgb(20 7 15 / 85%);
      }
      .quote .w {
        display: inline-block;
        margin-right: 0.22em;
      }
      .quote .hot {
        color: var(--accent);
      }
      /* Barre de censure + BIP */
      .censor {
        position: relative;
        display: inline-block;
        width: 300px;
        height: 0.95em;
        margin-right: 0.22em;
        vertical-align: -0.12em;
      }
      .censor-bar {
        position: absolute;
        inset: 0;
        background: var(--ink);
        border: 5px solid var(--fg);
      }
      .censor-bip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 0.5em;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      .portrait {
        position: absolute;
        display: block;
      }
      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .stamp {
        position: absolute;
        display: block;
        border: 10px solid currentColor;
        padding: 14px 30px 4px;
        font-family: var(--font-display);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
    </style>
