<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s6 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0f0612;
        }
        #s6 .s6-panel {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s6 .s6-spot {
          position: absolute;
          left: -260px;
          top: 820px;
          width: 1600px;
          height: 900px;
          background: radial-gradient(ellipse 22% 45% at 50% 50%, rgb(255 244 232 / 34%) 0%, rgb(255 244 232 / 0%) 100%);
        }
        #s6 .s6-lines {
          position: absolute;
          top: 220px;
          left: 64px;
          right: 64px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        #s6 .s6-line {
          display: block;
          font-size: 150px;
          color: var(--fg);
        }
        #s6 .s6-line.hot {
          color: var(--accent);
          font-size: 190px;
        }
        #s6 .s6-row {
          position: absolute;
          top: 1130px;
          left: 30px;
          right: 30px;
          display: flex;
          justify-content: space-between;
        }
        #s6 .s6-row .portrait {
          position: relative;
          width: 330px;
          height: 396px;
        }
        #s6 .s6-row .portrait img {
          filter: grayscale(0.7) brightness(0.55);
        }
        #s6 .s6-q {
          position: absolute;
          top: 1610px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 120px;
          color: var(--gold);
        }
        /* Confessionnal de Gisèle */
        #s6 #s6-conf {
          background: repeating-linear-gradient(90deg, #2b1233 0 70px, #220e29 70px 140px);
          opacity: 0;
        }
        #s6 .s6-conf-glow {
          width: 1000px;
          height: 1000px;
          left: 40px;
          top: 300px;
        }
        #s6 .s6-conf-p {
          left: 170px;
          top: 360px;
          width: 740px;
          height: 888px;
        }
        #s6 #s6-conf .lt {
          top: 1130px;
        }
        #s6 #s6-conf .quote {
          top: 1430px;
          font-size: 76px;
        }
      </style>

      <div id="s6" data-composition-id="s6-elimination" data-width="1080" data-height="1920">
        <div class="s6-panel" id="s6-cer">
          <div class="s6-spot"></div>
          <div class="s6-lines display">
            <span class="s6-line">Ce soir,</span>
            <span class="s6-line">l'un d'entre vous</span>
            <span class="s6-line">va quitter</span>
            <span class="s6-line hot">l'aventure.</span>
          </div>
          <div class="s6-row">
            <div class="portrait s6-m"><img src="assets/cast/marcel.svg" alt="Marcel" /></div>
            <div class="portrait s6-j"><img src="assets/cast/jeannine.svg" alt="Jeannine" /></div>
            <div class="portrait s6-g"><img src="assets/cast/gisele.svg" alt="Gisèle" /></div>
          </div>
          <div class="s6-q display">?</div>
        </div>

        <div class="s6-panel" id="s6-conf">
          <div class="glow s6-conf-glow"></div>
          <div class="portrait s6-conf-p"><img src="assets/cast/gisele-confessionnal.svg" alt="Gisèle" /></div>
          <div class="lt">
            <span class="lt-name">Gisèle</span>
            <span class="lt-role">94 ans · en confessionnal</span>
          </div>
          <div class="quote">
            <span class="w">«&nbsp;Ça</span><span class="w">fait</span><span class="w hot">94&nbsp;ans</span><span class="w">qu'on</span><span class="w">me</span><span class="w">le</span><span class="w">promet.&nbsp;»</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const q = (s) => "#s6 " + s;
          const tl = gsap.timeline({ paused: true });

          // Phrase rituelle, calée sur la voix off (0,1 → 2,5 s)
          tl.fromTo(q(".s6-line"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.5 }, 0.1);
          tl.fromTo(q(".s6-line.hot"), { scale: 1.4 }, { scale: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "power4.in", immediateRender: false }, 1.6);

          // Les trois candidats dans l'ombre
          tl.fromTo(q(".s6-row .portrait"), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.1 }, 1.2);
          tl.fromTo(q(".s6-q"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.9);
          tl.fromTo(q(".s6-q"), { rotation: -6 }, { rotation: 6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 2.3);

          // « Dun dun DUUUN » : le projecteur passe de l'un à l'autre (2,6 / 2,96 / 3,32)
          const hits = [
            [".s6-m", -360, 2.6],
            [".s6-j", 0, 2.96],
            [".s6-g", 360, 3.32],
          ];
          tl.fromTo(q(".s6-spot"), { x: -900 }, { x: -360, duration: 0.12, ease: "power2.out" }, 2.5);
          hits.forEach(([sel, x, t], i) => {
            if (i > 0) tl.to(q(".s6-spot"), { x: x, duration: 0.12, ease: "power2.out" }, t - 0.06);
            tl.fromTo(q(sel + " img"), { filter: "grayscale(0.7) brightness(0.55)" }, { filter: "grayscale(0) brightness(1)", duration: 0.06, ease: "none" }, t);
            tl.fromTo(q(sel), { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
            if (i < 2) {
              tl.to(q(sel + " img"), { filter: "grayscale(0.7) brightness(0.55)", duration: 0.08, ease: "none" }, t + 0.3);
              tl.to(q(sel), { scale: 1, duration: 0.1, ease: "power2.in" }, t + 0.28);
            }
          });

          // Coupe vers le confessionnal de Gisèle (global 39,3 s)
          tl.fromTo("#s6-conf", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 3.3);
          tl.fromTo(q(".s6-conf-glow"), { scale: 0.9 }, { scale: 1.05, duration: 1.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.3);
          tl.fromTo(q(".s6-conf-p"), { scale: 1.1, x: -8 }, { scale: 1.02, x: 8, duration: 2.7, ease: "sine.inOut" }, 3.3);
          tl.fromTo(q("#s6-conf .lt-name"), { x: -720 }, { x: 0, duration: 0.4, ease: "power4.out" }, 3.4);
          tl.fromTo(q("#s6-conf .lt-role"), { x: -720 }, { x: 0, duration: 0.4, ease: "power4.out" }, 3.5);
          tl.fromTo(q("#s6-conf .quote .w"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out", stagger: 0.11 }, 3.7);

          window.__timelines["s6-elimination"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
