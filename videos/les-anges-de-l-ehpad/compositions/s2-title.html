<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s2 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
        }
        #s2 .s2-rays {
          position: absolute;
          width: 2600px;
          height: 2600px;
          left: -760px;
          top: -380px;
          background: repeating-conic-gradient(from 0deg, rgb(255 46 136 / 30%) 0deg 9deg, rgb(255 46 136 / 0%) 9deg 18deg);
          border-radius: 50%;
        }
        #s2 .s2-glow {
          width: 1300px;
          height: 1300px;
          left: -110px;
          top: 270px;
        }
        #s2 .s2-badge {
          position: absolute;
          top: 230px;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
        }
        #s2 .s2-badge span {
          display: block;
          border: 4px solid var(--accent);
          background: rgb(26 11 30 / 80%);
          color: var(--fg);
          font-size: 32px;
          padding: 14px 26px;
        }
        #s2 .s2-lockup {
          position: absolute;
          top: 470px;
          left: 0;
          right: 0;
          height: 760px;
        }
        #s2 .s2-halo {
          position: absolute;
          left: 290px;
          top: 0;
          width: 500px;
          height: 110px;
          border-radius: 50%;
          border: 18px solid var(--gold);
          box-shadow:
            0 0 40px rgb(255 210 63 / 80%),
            inset 0 0 30px rgb(255 210 63 / 60%);
        }
        #s2 .s2-wing {
          position: absolute;
          top: 150px;
          width: 330px;
          height: 380px;
        }
        #s2 .s2-wing svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #s2 .s2-wing-l {
          left: -150px;
        }
        #s2 .s2-wing-r {
          right: -150px;
        }
        #s2 .s2-t1 {
          position: absolute;
          top: 150px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 330px;
          color: var(--fg);
          text-shadow: 10px 10px 0 var(--accent);
        }
        #s2 .s2-t2 {
          position: absolute;
          top: 470px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 220px;
          color: var(--gold);
          text-shadow: 8px 8px 0 var(--ink);
        }
        #s2 .s2-tag {
          position: absolute;
          top: 1330px;
          left: 80px;
          right: 80px;
          text-align: center;
          font-weight: 900;
          font-size: 60px;
          line-height: 1.15;
        }
        #s2 .s2-tag span {
          display: block;
        }
        #s2 .s2-tag .s2-tag-2 {
          color: var(--accent);
        }
        #s2 .s2-csa {
          position: absolute;
          right: 70px;
          bottom: 150px;
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #s2 .s2-csa-dot {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          background: var(--fg);
          color: var(--ink);
          font-family: var(--font-display);
          font-size: 70px;
          line-height: 1;
          padding-top: 6px;
        }
        #s2 .s2-csa-txt {
          display: block;
          width: 300px;
          font-size: 26px;
          line-height: 1.3;
          color: var(--muted);
        }
      </style>

      <div id="s2" data-composition-id="s2-title" data-width="1080" data-height="1920">
        <div class="s2-rays"></div>
        <div class="glow s2-glow"></div>

        <div class="s2-badge"><span class="mono">Saison 1 · Résidence Les Mimosas</span></div>

        <div class="s2-lockup">
          <div class="s2-wing s2-wing-l">
            <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
              <g fill="#fff4e8" stroke="#ffd23f" stroke-width="6">
                <path d="M320 60 C220 0 60 20 10 120 C90 100 160 110 210 140 Z" />
                <path d="M320 120 C210 80 70 120 30 210 C110 180 180 190 230 210 Z" />
                <path d="M320 180 C220 160 100 220 70 300 C140 260 200 260 250 270 Z" />
                <path d="M320 240 C240 240 150 300 140 370 C190 320 240 310 280 315 Z" />
              </g>
            </svg>
          </div>
          <div class="s2-wing s2-wing-r">
            <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
              <g fill="#fff4e8" stroke="#ffd23f" stroke-width="6" transform="translate(330 0) scale(-1 1)">
                <path d="M320 60 C220 0 60 20 10 120 C90 100 160 110 210 140 Z" />
                <path d="M320 120 C210 80 70 120 30 210 C110 180 180 190 230 210 Z" />
                <path d="M320 180 C220 160 100 220 70 300 C140 260 200 260 250 270 Z" />
                <path d="M320 240 C240 240 150 300 140 370 C190 320 240 310 280 315 Z" />
              </g>
            </svg>
          </div>
          <div class="s2-halo"></div>
          <div class="s2-t1 display">Les Anges</div>
          <div class="s2-t2 display">de l'EHPAD</div>
        </div>

        <div class="s2-tag">
          <span class="s2-tag-1">Ils sont venus chercher l'amour.</span>
          <span class="s2-tag-2">Avant le goûter de 15 h.</span>
        </div>

        <div class="s2-csa">
          <span class="s2-csa-dot">+75</span>
          <span class="s2-csa-txt mono">Déconseillé aux moins de 75 ans</span>
        </div>
      </div>

      <script>
        (function () {
          const q = (s) => "#s2 " + s;
          const tl = gsap.timeline({ paused: true });

          // Fond : rayons qui tournent, lueur qui respire
          tl.fromTo(q(".s2-rays"), { rotation: 0 }, { rotation: 30, duration: 5, ease: "none" }, 0);
          tl.fromTo(q(".s2-glow"), { scale: 0.85, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          tl.fromTo(q(".s2-badge span"), { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);

          // Titre qui claque (boom à 0,5 s)
          tl.fromTo(q(".s2-t1"), { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power4.in" }, 0.2);
          tl.fromTo(q(".s2-lockup"), { y: 0 }, { y: 16, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, 0.52);
          tl.fromTo(q(".s2-t2"), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.7);

          // Auréole qui tombe, ailes qui se déploient puis battent
          tl.fromTo(q(".s2-halo"), { y: -300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "bounce.out" }, 0.85);
          tl.fromTo(q(".s2-wing-l"), { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.0);
          tl.fromTo(q(".s2-wing-r"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.0);
          tl.fromTo(q(".s2-wing-l"), { rotation: 0 }, { rotation: -12, transformOrigin: "100% 50%", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, 1.45);
          tl.fromTo(q(".s2-wing-r"), { rotation: 0 }, { rotation: 12, transformOrigin: "0% 50%", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, 1.45);

          // Accroche
          tl.fromTo(q(".s2-tag-1"), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.2);
          tl.fromTo(q(".s2-tag-2"), { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.in" }, 2.95);

          // Signalétique « +75 »
          tl.fromTo(q(".s2-csa"), { x: 420 }, { x: 0, duration: 0.5, ease: "power4.out" }, 3.4);

          window.__timelines["s2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
