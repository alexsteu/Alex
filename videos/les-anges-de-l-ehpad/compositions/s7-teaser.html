<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s7 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
        }
        #s7 .s7-panel {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        /* Intro « dans le prochain épisode » */
        #s7 .s7-intro-glow {
          width: 1100px;
          height: 1100px;
          left: -10px;
          top: 400px;
        }
        #s7 .s7-intro-txt {
          position: absolute;
          top: 640px;
          left: 64px;
          right: 64px;
          display: flex;
          flex-direction: column;
          font-size: 200px;
          color: var(--fg);
          text-shadow:
            -8px 0 0 rgb(0 220 255 / 70%),
            8px 0 0 rgb(255 46 136 / 85%);
        }
        #s7 .s7-intro-txt span {
          display: block;
        }
        /* Flashs */
        #s7 .s7-flash {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
          opacity: 0;
        }
        #s7 .s7-f1 {
          background: var(--accent);
          color: var(--ink);
        }
        #s7 .s7-f2 {
          background: var(--ink);
          color: var(--accent);
        }
        #s7 .s7-f3 {
          background: var(--gold);
          color: var(--ink);
        }
        #s7 .s7-f4 {
          background: var(--fg);
          color: var(--ink);
        }
        #s7 .s7-emoji {
          display: block;
          font-size: 300px;
          line-height: 1;
        }
        #s7 .s7-word {
          display: block;
          padding: 0 60px;
          text-align: center;
          font-size: 210px;
        }
        /* Carton de fin */
        #s7 #s7-end {
          opacity: 0;
          background: var(--bg);
        }
        #s7 .s7-end-rays {
          position: absolute;
          width: 2600px;
          height: 2600px;
          left: -760px;
          top: -500px;
          border-radius: 50%;
          background: repeating-conic-gradient(from 0deg, rgb(255 210 63 / 18%) 0deg 8deg, rgb(255 210 63 / 0%) 8deg 16deg);
        }
        #s7 .s7-end-glow {
          width: 1200px;
          height: 1200px;
          left: -60px;
          top: 160px;
        }
        #s7 .s7-halo {
          position: absolute;
          left: 340px;
          top: 360px;
          width: 400px;
          height: 90px;
          border-radius: 50%;
          border: 16px solid var(--gold);
          box-shadow: 0 0 40px rgb(255 210 63 / 80%);
        }
        #s7 .s7-end-t1 {
          position: absolute;
          top: 480px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 280px;
          color: var(--fg);
          text-shadow: 10px 10px 0 var(--accent);
        }
        #s7 .s7-end-t2 {
          position: absolute;
          top: 740px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 190px;
          color: var(--gold);
          text-shadow: 8px 8px 0 var(--ink);
        }
        #s7 .s7-soon {
          position: absolute;
          top: 1120px;
          left: 64px;
          right: 64px;
          text-align: center;
          font-weight: 900;
          font-size: 92px;
          line-height: 1.1;
        }
        #s7 .s7-soon2 {
          position: absolute;
          top: 1250px;
          left: 64px;
          right: 64px;
          text-align: center;
          font-weight: 900;
          font-size: 74px;
          line-height: 1.15;
          color: var(--accent);
        }
        #s7 .s7-legal {
          position: absolute;
          bottom: 120px;
          left: 64px;
          right: 64px;
          text-align: center;
          font-size: 26px;
          line-height: 1.5;
          color: var(--muted);
        }
        #s7 .s7-confetti {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #s7 .s7-c {
          position: absolute;
          left: 530px;
          top: 760px;
          width: 22px;
          height: 36px;
          border-radius: 4px;
        }
        #s7 .s7-black {
          position: absolute;
          inset: 0;
          background: #000;
          opacity: 0;
        }
      </style>

      <div id="s7" data-composition-id="s7-teaser" data-width="1080" data-height="1920">
        <div class="s7-panel" id="s7-intro">
          <div class="glow s7-intro-glow"></div>
          <div class="s7-intro-txt display">
            <span>Dans le</span>
            <span>prochain</span>
            <span>épisode…</span>
          </div>
        </div>

        <div class="s7-panel s7-flash s7-f1"><span class="s7-emoji">💍</span><span class="s7-word display">Un mariage.</span></div>
        <div class="s7-panel s7-flash s7-f2"><span class="s7-emoji">💔</span><span class="s7-word display">Un divorce.</span></div>
        <div class="s7-panel s7-flash s7-f3"><span class="s7-emoji">🦴</span><span class="s7-word display">Une hanche cassée.</span></div>
        <div class="s7-panel s7-flash s7-f4"><span class="s7-emoji">💰</span><span class="s7-word display">Et l'héritage.</span></div>

        <div class="s7-panel" id="s7-end">
          <div class="s7-end-rays"></div>
          <div class="glow s7-end-glow"></div>
          <div class="s7-confetti"></div>
          <div class="s7-halo"></div>
          <div class="s7-end-t1 display">Les Anges</div>
          <div class="s7-end-t2 display">de l'EHPAD</div>
          <div class="s7-soon">Bientôt.</div>
          <div class="s7-soon2">Très bientôt, pour certains.</div>
          <div class="s7-legal mono">Aucun papi ni aucune mamie n'a été maltraité pendant ce tournage. Gisèle a gagné au loto.</div>
        </div>

        <div class="s7-black"></div>
      </div>

      <script>
        (function () {
          const q = (s) => "#s7 " + s;
          const tl = gsap.timeline({ paused: true });

          // Intro avec léger glitch RVB (0 → 1,3 s)
          tl.fromTo(q(".s7-intro-glow"), { scale: 0.8 }, { scale: 1.1, duration: 1.4, ease: "sine.inOut" }, 0);
          tl.fromTo(q(".s7-intro-txt span"), { x: -900 }, { x: 0, duration: 0.35, ease: "power4.out", stagger: 0.18 }, 0.05);
          tl.fromTo(q(".s7-intro-txt"), { x: 0 }, { x: 10, duration: 0.03, ease: "steps(1)", yoyo: true, repeat: 9, immediateRender: false }, 0.9);

          tl.to("#s7-intro", { opacity: 0, duration: 0.03, ease: "none" }, 1.42);

          // Quatre flashs, 0,7 s chacun (tampons globaux 43,4 / 44,1 / 44,8 / 45,5)
          [".s7-f1", ".s7-f2", ".s7-f3", ".s7-f4"].forEach((f, i) => {
            const t = 1.4 + i * 0.7;
            tl.fromTo(q(f), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, t);
            tl.fromTo(q(f + " .s7-word"), { scale: 1.7 }, { scale: 1, duration: 0.18, ease: "power4.in" }, t);
            tl.fromTo(q(f + " .s7-emoji"), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.5)" }, t + 0.05);
            if (i < 3) tl.to(q(f), { opacity: 0, duration: 0.03, ease: "none" }, t + 0.7);
          });

          // Carton de fin (boom global 46,2 s)
          tl.fromTo("#s7-end", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 4.2);
          tl.to(q(".s7-f4"), { opacity: 0, duration: 0.05, ease: "none" }, 4.25);
          tl.fromTo(q(".s7-end-rays"), { rotation: 0 }, { rotation: -24, duration: 3.8, ease: "none" }, 4.2);
          tl.fromTo(q(".s7-end-glow"), { scale: 0.85 }, { scale: 1.1, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.2);
          tl.fromTo(q(".s7-end-t1"), { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 4.2);
          tl.fromTo(q(".s7-end-t2"), { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 4.45);
          tl.fromTo(q(".s7-halo"), { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "bounce.out" }, 4.5);
          tl.fromTo(q(".s7-halo"), { rotation: -4 }, { rotation: 4, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.1);
          tl.fromTo(q(".s7-soon"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 5.85);
          tl.fromTo(q(".s7-soon2"), { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 6.5);
          tl.fromTo(q(".s7-legal"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 6.8);

          // Confettis déterministes : envol puis chute
          const box = document.querySelector("#s7 .s7-confetti");
          const colors = ["#ff2e88", "#ffd23f", "#fff4e8", "#a374e6", "#2bb3a3"];
          const N = 48;
          for (let i = 0; i < N; i++) {
            const c = document.createElement("span");
            c.className = "s7-c";
            c.style.background = colors[i % colors.length];
            box.appendChild(c);
          }
          const parts = box.querySelectorAll(".s7-c");
          const dx = (i) => Math.cos(i * 2.39996) * (220 + ((i * 37) % 300));
          const up = (i) => -(420 + ((i * 53) % 360));
          tl.fromTo(parts, { x: 0, y: 0, rotation: 0, opacity: 0 }, {
            x: (i) => dx(i),
            y: (i) => up(i),
            rotation: (i) => 180 + i * 41,
            opacity: 1,
            duration: 0.7,
            ease: "power3.out",
          }, 4.25);
          tl.fromTo(parts, { y: (i) => up(i) }, {
            x: (i) => dx(i) * 1.35,
            y: (i) => 900 + ((i * 29) % 400),
            rotation: (i) => 540 + i * 63,
            duration: 2.6,
            ease: "power1.in",
            immediateRender: false,
          }, 4.95);

          // Fondu au noir final
          tl.fromTo(q(".s7-black"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, 7.5);

          window.__timelines["s7-teaser"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
