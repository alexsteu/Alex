<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s1 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: repeating-linear-gradient(90deg, #2b1233 0 70px, #220e29 70px 140px);
        }
        #s1 .s1-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 70% 55% at 50% 42%, rgb(26 11 30 / 0%) 0%, rgb(26 11 30 / 92%) 100%);
        }
        #s1 .s1-neon {
          position: absolute;
          top: 120px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 150px;
          color: var(--accent);
          text-shadow:
            0 0 18px rgb(255 46 136 / 90%),
            0 0 60px rgb(255 46 136 / 60%);
        }
        #s1 .s1-glow {
          width: 1000px;
          height: 1000px;
          left: 40px;
          top: 300px;
        }
        #s1 .s1-cam {
          position: absolute;
          left: 170px;
          top: 360px;
          width: 740px;
          height: 888px;
        }
        #s1 .s1-cam .portrait {
          inset: 0;
        }
        #s1 .lt {
          top: 1130px;
        }
        #s1 .quote {
          top: 1430px;
        }
        #s1 .s1-flash {
          position: absolute;
          inset: 0;
          background: var(--fg);
          opacity: 0;
        }
      </style>

      <div id="s1" data-composition-id="s1-cold-open" data-width="1080" data-height="1920">
        <div class="glow s1-glow"></div>
        <div class="s1-neon display">Confessionnal</div>
        <div class="s1-cam">
          <div class="portrait"><img src="assets/cast/jeannine.svg" alt="Jeannine" /></div>
        </div>
        <div class="s1-vignette"></div>

        <div class="lt">
          <span class="lt-name">Jeannine</span>
          <span class="lt-role">87 ans · veuve ×3</span>
        </div>

        <div class="quote">
          <span class="w">«&nbsp;Cette</span><span class="w">vieille</span><span class="censor"><span class="censor-bar"></span><span class="censor-bip">BIIIP</span></span><span class="w">m'a</span><span class="w">piqué</span><span class="w">mon</span><span class="w">dentier…</span><span class="w hot">ET</span><span class="w hot">MON</span><span class="w hot">MEC&nbsp;!&nbsp;»</span>
        </div>

        <div class="s1-flash"></div>
      </div>

      <script>
        (function () {
          const root = "#s1";
          const q = (s) => root + " " + s;
          const tl = gsap.timeline({ paused: true });
          const words = gsap.utils.toArray(q(".quote .w"));

          // Fond : la lueur respire, le néon s'allume en grésillant
          tl.fromTo(q(".s1-glow"), { scale: 0.9, opacity: 0.7 }, { scale: 1.05, opacity: 1, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.fromTo(q(".s1-neon"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "steps(1)" }, 0.05)
            .to(q(".s1-neon"), { opacity: 0.25, duration: 0.05, ease: "steps(1)" }, 0.16)
            .to(q(".s1-neon"), { opacity: 1, duration: 0.05, ease: "steps(1)" }, 0.24);

          // Caméra « à l'épaule » : légère dérive continue
          tl.fromTo(q(".s1-cam"), { x: -10, y: 6, rotation: -0.6 }, { x: 10, y: -6, rotation: 0.6, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          tl.fromTo(q(".s1-cam .portrait"), { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);

          // Bandeau nom
          tl.fromTo(q(".lt-name"), { x: -720 }, { x: 0, duration: 0.42, ease: "power4.out" }, 0.3);
          tl.fromTo(q(".lt-role"), { x: -720 }, { x: 0, duration: 0.42, ease: "power4.out" }, 0.42);

          // Citation : « Cette vieille »
          tl.fromTo(words.slice(0, 2), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.12 }, 0.4);
          // Censure + BIP (synchro avec sfx-bleep-1 à 0,9 s)
          tl.fromTo(q(".censor-bar"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.12, ease: "power2.out" }, 0.9);
          tl.fromTo(q(".censor-bip"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(3)" }, 0.95);
          tl.fromTo(q(".s1-cam .portrait"), { x: 0 }, { x: 14, duration: 0.04, ease: "none", yoyo: true, repeat: 7, immediateRender: false }, 0.9);
          // « m'a piqué mon dentier… »
          tl.fromTo(words.slice(2, 6), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out", stagger: 0.14 }, 1.4);
          // « ET MON MEC ! » : claque + zoom sur le visage
          tl.fromTo(words.slice(6), { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in", stagger: 0.1 }, 2.55);
          tl.fromTo(q(".s1-cam .portrait"), { scale: 1 }, { scale: 1.16, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.6);

          // Flash blanc de sortie
          tl.fromTo(q(".s1-flash"), { opacity: 0 }, { opacity: 0.9, duration: 0.12, ease: "power1.in" }, 4.3);

          window.__timelines["s1-cold-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
