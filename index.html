<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Journal Santé">
  <meta name="theme-color" content="#0f0f13">
  <meta name="description" content="Suivi santé personnel : ventre, humeur, sport, protéines, sommeil.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Journal Santé</title>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Entrées fichier cachées (caméra / import) -->
  <input type="file" id="photoProtein" accept="image/*" capture="environment" hidden>
  <input type="file" id="photoMeal" accept="image/*" capture="environment" hidden>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
