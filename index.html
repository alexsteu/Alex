/* Une lettre courte, une seule colonne : le texte, la démo, un bouton. */
:root{--bg:#FFFFFF;--fg:#16181D;--soft:#4A4F57;--quiet:#7A7F87;--accent:#2038EC;--wa:#14803C;

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 18px/1.6 var(--font);-webkit-font-smoothing:antialiased}
.w{max-width:540px;margin:0 auto;padding-block:28px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:2px;font:700 20px/1 var(--font);letter-spacing:.03em}
.logo i{display:inline-block;width:17px;height:17px;border:3px solid var(--fg);border-radius:50%;position:relative}
.logo i:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent)}
.hello{color:var(--quiet);font-size:16px;margin:8px 0 -10px}
h1{font:700 32px/1.15 var(--font);letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
.soft{color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:999px;background:var(--fg);color:#fff;font:600 18px/1.2 var(--font);text-decoration:none;padding:14px 22px;text-align:center}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.wa{background:var(--wa)}
.small{font-size:15px;color:var(--quiet)}
.vid{border-radius:18px;overflow:hidden;background:#0d0f13;aspect-ratio:9/16;max-height:72vh;max-width:100%;margin:0 auto}
.vid video{width:100%;height:100%;object-fit:contain;display:block}
h2{font:700 21px/1.3 var(--font);margin:14px 0 -10px}
.num{font-weight:700;font-size:24px;letter-spacing:.01em;user-select:all}
.sign{color:var(--soft)}
.sign b{color:var(--fg);font-weight:600}
footer{font-size:14px;color:var(--quiet);margin-top:20px}
