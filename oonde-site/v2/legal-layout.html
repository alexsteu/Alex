<title>{{TITLE}} · OONDE</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="noindex">
{{FONTS}}
<style>
/* Page légale : une colonne de lecture, même DA que le site. */
:root{--encre:#0E1116;--paper:#F5F6F3;--card:#FFFFFF;--ink:#0E1116;--muted:#5C6470;--line:#E7EAE5;--accent:#2038EC;
 --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0B0E13;--card:#141922;--ink:#EDEFF2;--muted:#9AA3B0;--line:#232A35;--accent:#7D8DFF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B0E13;--card:#141922;--ink:#EDEFF2;--muted:#9AA3B0;--line:#232A35;--accent:#7D8DFF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
.nav{background:var(--encre);color:#fff}
.nav .in,.doc{max-width:760px;margin:0 auto;padding-inline:20px}
.nav .in{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}
.logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;text-decoration:none;color:#fff;display:flex;align-items:center;gap:9px}
.logo i{width:12px;height:12px;border-radius:50%;background:#2038EC}
.nav a.back{color:#fff;opacity:.8;font-size:15px;text-decoration:none}.nav a.back:hover{opacity:1}
.doc{padding-block:56px 72px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(34px,5vw,48px);margin:10px 0 8px}
h2{font-size:22px;margin:40px 0 10px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:22px 0 6px}
.updated{color:var(--muted);font-size:14px;margin:0 0 8px}
.lead{font-size:19px;color:var(--muted)}
p,li{max-width:66ch}
ul{padding-left:22px}li{margin:4px 0}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:18px 0}
.card p{margin:4px 0}
dl.id{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:8px 20px;margin:0}
dl.id dt{color:var(--muted);font-size:15px}dl.id dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (max-width:560px){dl.id{grid-template-columns:minmax(0,1fr)}dl.id dd{margin-bottom:8px}}
.law{font-family:var(--mono);font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
footer .in{max-width:760px;margin:0 auto;padding-inline:20px;display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:inherit;text-decoration:none}footer a:hover{text-decoration:underline}
footer a[aria-current]{color:var(--ink);font-weight:600}
</style>
<header class="nav"><div class="in"><a class="logo" href="index.html"><i aria-hidden="true"></i>OONDE</a><a class="back" href="index.html">← Retour au site</a></div></header>
<main class="doc">
{{BODY}}
</main>
<footer><div class="in"><span>● OONDE · © 2026</span><a href="mentions-legales.html"{{CUR_M}}>Mentions légales</a><a href="confidentialite.html"{{CUR_C}}>Confidentialité</a><a href="conditions.html"{{CUR_G}}>Conditions générales</a></div></footer>
